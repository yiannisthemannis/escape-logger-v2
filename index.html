<script>

const params = new URLSearchParams(window.location.search);

const event = params.get("event");
const room = params.get("room");
const team = params.get("team");

const scriptURL =
"https://script.google.com/macros/s/AKfycbx4tG8PIFQQEi9fJNUD2E1cwbKQIPAZlNZGdRHinYG8EcjUuA2Q6huM-qNz5K7_34TXtw/exec";

document.body.innerHTML = "STARTING...";

fetch(
  scriptURL +
  "?event=" + encodeURIComponent(event) +
  "&room=" + encodeURIComponent(room) +
  "&team=" + encodeURIComponent(team)
)
.then(r => {
  document.body.innerHTML = "SUCCESS SENT";
})
.catch(err => {
  document.body.innerHTML = "FAILED: " + err;
});

</script>
