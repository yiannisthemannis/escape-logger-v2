<script>
(function () {

  const params = new URLSearchParams(window.location.search);

  const event = params.get("event") || "unknown_event";
  const room  = params.get("room")  || "unknown_room";
  const team  = params.get("team")  || "unknown_team";

  const scriptURL =
    "https://script.google.com/macros/s/AKfycbx4tG8PIFQQEi9fJNUD2E1cwbKQIPAZlNZGdRHinYG8EcjUuA2Q6huM-qNz5K7_34TXtw/exec";

  const url =
    scriptURL +
    "?event=" + encodeURIComponent(event) +
    "&room=" + encodeURIComponent(room) +
    "&team=" + encodeURIComponent(team);

  const img = new Image();

  img.src =
    scriptURL +
    "?event=" + encodeURIComponent(event) +
    "&room=" + encodeURIComponent(room) +
    "&team=" + encodeURIComponent(team);
  
  document.body.innerHTML = "logged";
})();
</script>
