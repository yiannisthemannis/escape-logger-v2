<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Logger</title>
</head>
<body>

<script>
const params = new URLSearchParams(window.location.search);

const event = params.get("event");
const room = params.get("room");
const team = params.get("team");

const scriptURL =
"https://script.google.com/macros/s/AKfycbx4tG8PIFQQEi9fJNUD2E1cwbKQIPAZlNZGdRHinYG8EcjUuA2Q6huM-qNz5K7_34TXtw/exec";

fetch(scriptURL, {
  method: "POST",
  body: JSON.stringify({
    event,
    room,
    team
  })
});

</script>

</body>
</html>
